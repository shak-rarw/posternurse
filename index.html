<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undi Poster Paling Menarik</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Undi Poster Paling Menarik</h1>
  <form id="poll-form">
    <div class="options">
      <!-- Ulang gambar ikut semester dan kumpulan -->
      <label>
        <input type="radio" name="poll" value="SEM 1 KUMPULAN 1" />
        <img src="images/SEM 1 KUMPULAN 1.jpg" alt="SEM 1 KUMPULAN 1" />
      </label>
      <label>
        <input type="radio" name="poll" value="SEM 1 KUMPULAN 2" />
        <img src="images/SEM 1 KUMPULAN 2.jpg" alt="SEM 1 KUMPULAN 2" />
      </label>
      <label>
        <input type="radio" name="poll" value="SEM 2 KUMPULAN 1" />
        <img src="images/SEM 2 KUMPULAN 1.jpg" alt="SEM 2 KUMPULAN 1" />
      </label>
      <label>
        <input type="radio" name="poll" value="SEM 2 KUMPULAN 2" />
        <img src="images/SEM 2 KUMPULAN 2.jpg" alt="SEM 2 KUMPULAN 2" />
      </label>
       <!-- SEM 3 -->
            <label>
                <input type="radio" name="poll" value="SEM 3 KUMPULAN 1" hidden>
                <img src="images/SEM 3 KUMPULAN 1.jpg" alt="SEM 3 KUMPULAN 1" class="poll-image">
            </label>
            <label>
                <input type="radio" name="poll" value="SEM 3 KUMPULAN 2" hidden>
                <img src="images/SEM 3 KUMPULAN 2.jpg" alt="SEM 3 KUMPULAN 2" class="poll-image">
            </label>

            <!-- SEM 4 -->
            <label>
                <input type="radio" name="poll" value="SEM 4 KUMPULAN 1" hidden>
                <img src="images/SEM 4 KUMPULAN 1.jpg" alt="SEM 4 KUMPULAN 1" class="poll-image">
            </label>
            <label>
                <input type="radio" name="poll" value="SEM 4 KUMPULAN 2" hidden>
                <img src="images/SEM 4 KUMPULAN 2.jpg" alt="SEM 4 KUMPULAN 2" class="poll-image">
            </label>

            <!-- SEM 5 -->
            <label>
                <input type="radio" name="poll" value="SEM 5 KUMPULAN 1" hidden>
                <img src="images/SEM 5 KUMPULAN 1.jpg" alt="SEM 5 KUMPULAN 1" class="poll-image">
            </label>
            <label>
                <input type="radio" name="poll" value="SEM 5 KUMPULAN 2" hidden>
                <img src="images/SEM 5 KUMPULAN 2.jpg" alt="SEM 5 KUMPULAN 2" class="poll-image">
            </label>

            <!-- SEM 6 -->
            <label>
                <input type="radio" name="poll" value="SEM 6 KUMPULAN 1" hidden>
                <img src="images/SEM 6 KUMPULAN 1.jpg" alt="SEM 6 KUMPULAN 1" class="poll-image">
            </label>
            <label>
                <input type="radio" name="poll" value="SEM 6 KUMPULAN 2" hidden>
                <img src="images/SEM 6 KUMPULAN 2.jpg" alt="SEM 6 KUMPULAN 2" class="poll-image">
            </label>

            <br><br>
            <button type="submit">VOTE</button>
        </form>
 
  <div id="poll-result" style="display: none;">
    <h2>Keputusan Undian</h2>
    <ul id="result-list"></ul>
    <p id="totalVotes"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
